name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      commit_apk:
        description: "Commit the signed APK to dist/ on this branch"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow (WebP conversion)
        run: pip install pillow

      # Downloads only photos not yet in content/images.json, so this is quick once the library exists.
      - name: Fetch new photos from Wikimedia Commons
        run: python3 tools/fetch_images.py
        continue-on-error: true

      - name: Commit newly fetched photos back to the branch
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/images.json app/src/main/assets/img
          if ! git diff --cached --quiet; then
            git commit -m "Add photos fetched from Wikimedia Commons [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Build content bundle (index, bodies, search, credits)
        run: python3 tools/build_content.py

      - name: Check links, images and credits
        run: python3 tools/check_links.py --min 120

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK and run unit tests
        run: ./gradlew --no-daemon assembleRelease testDebugUnitTest

      - name: Show APK size and signature
        run: |
          ls -l app/build/outputs/apk/release/
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SurvivalGuide-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Commit APK to dist/ (when the commit message contains [apk] or on request)
        if: github.event_name != 'pull_request' && (contains(github.event.head_commit.message, '[apk]') || inputs.commit_apk)
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/app-release.apk
          git add dist/app-release.apk
          if ! git diff --cached --quiet; then
            git commit -m "Release APK built by CI [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
