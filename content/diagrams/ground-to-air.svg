<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" role="img" aria-label="Ground-to-air signals: V requires assistance, X requires medical assistance, N no, Y yes, arrow proceeding in this direction">
  <style>.s{fill:none;stroke:#c8102e;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.t{font:700 17px sans-serif;fill:#111;text-anchor:middle}.b{fill:#e9e4d4;stroke:#555;stroke-width:1}</style>
  <rect class="b" x="5" y="5" width="90" height="90" rx="6"/><path class="s" d="M25 25 50 75 75 25"/>
  <text class="t" x="50" y="122">V</text><text class="t" x="50" y="150">Help</text>
  <rect class="b" x="105" y="5" width="90" height="90" rx="6"/><path class="s" d="M125 25 175 75M175 25 125 75"/>
  <text class="t" x="150" y="122">X</text><text class="t" x="150" y="150">Medical</text>
  <rect class="b" x="205" y="5" width="90" height="90" rx="6"/><path class="s" d="M225 75V25l50 50V25"/>
