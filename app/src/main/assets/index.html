<!doctype html>
<html lang="en-GB" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Survival Guide</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
<script>
  // v1.2 moved the guide to a new origin; the app hands over the old saved pages and settings once.
  try {
    var m = window.Android && window.Android.takeMigratedStorage && window.Android.takeMigratedStorage();
    if (m) {
      var o = JSON.parse(m);
      for (var k in o) if (localStorage.getItem(k) === null) localStorage.setItem(k, o[k]);
    }
  } catch (e) {}
  // Apply theme and text size before first paint (no flash of the wrong theme).
  try {
    var s = JSON.parse(localStorage.getItem("settings") || "{}");
    document.documentElement.setAttribute("data-theme", s.theme || "dark");
    document.documentElement.style.setProperty("--fs", (s.fs || 18) + "px");
  } catch (e) {}
</script>
</head>
<body>
<header id="bar">
  <button id="back" class="icon-btn" aria-label="Back" hidden><svg class="ic" aria-hidden="true"><use href="#i-arrow-left"/></svg></button>
  <h1 id="title">Survival Guide</h1>
  <span id="sensor" class="chip-sensor" role="status" hidden></span>
  <span id="batt" class="chip-batt" hidden></span>
  <button id="power" class="icon-btn" aria-label="Before you power off" hidden><svg class="ic" aria-hidden="true"><use href="#i-power"/></svg></button>
  <button id="save" class="icon-btn" aria-label="Save" aria-pressed="false" hidden><svg class="ic" aria-hidden="true"><use href="#i-bookmark"/></svg></button>
</header>

<main id="view" tabindex="-1"></main>

<nav id="nav" aria-label="Main">
  <a href="#/" data-tab="home"><span class="np"><svg class="ic" aria-hidden="true"><use href="#i-house"/></svg></span>Home</a>
  <a href="#/search" data-tab="search"><span class="np"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg></span>Search</a>
  <a href="#/species" data-tab="species"><span class="np"><svg class="ic" aria-hidden="true"><use href="#i-leaf"/></svg></span>Species</a>
  <a href="#/saved" data-tab="saved"><span class="np"><svg class="ic" aria-hidden="true"><use href="#i-bookmark"/></svg></span>Saved</a>
  <a href="#/tools" data-tab="tools"><span class="np"><svg class="ic" aria-hidden="true"><use href="#i-wrench"/></svg></span>Tools</a>
</nav>

<div id="viewer" hidden>
  <div id="viewer-stage"><img id="viewer-img" alt=""></div>
  <button id="viewer-close" class="icon-btn" aria-label="Close photo"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
  <button id="viewer-prev" class="icon-btn" aria-label="Previous photo"><svg class="ic" aria-hidden="true"><use href="#i-chevron-left"/></svg></button>
  <button id="viewer-next" class="icon-btn" aria-label="Next photo"><svg class="ic" aria-hidden="true"><use href="#i-chevron-right"/></svg></button>
  <p id="viewer-caption"></p>
</div>
<div id="dim" aria-hidden="true"></div>

<noscript>This guide needs JavaScript enabled.</noscript>
<script src="icons.js"></script>
<script src="content/index.js"></script>
<script src="geo.js"></script>
<script src="app.js"></script>
<script src="tools.js"></script>
<script>App.start();</script>
</body>
</html>
